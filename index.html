<!doctype html>
<html>
<head>
<script src="script.js"></script>
<link href="style.css" rel="stylesheet" type="text/css">
<meta charset="UTF-8">
<title>Untitled Document</title>
</head>
<body>
    <div id="create-character">Create Character
        <div id="dropdown">
            <label for="nameInput">Enter name:</label> <br>
            <input type="text" id="nameInput" placeholder="Name"> <br>
            <label for="healthInput">Enter health:</label> <br>
            <input type="text" id="healthInput" placeholder="Health"> <br>
            <label for="attackInput">Enter attack:</label> <br>
            <input type="text" id="attackInput" placeholder="Attack"> <br>
            <label for="classInput">Select a class:</label> <br>
            <select id="classInput">
                <option value="dwarf">Dwarf</option>
                <option value="elf">Elf</option>
                <option value="human">Human</option>
                <option value="orc">Orc</option>
                <option value="mage">Mage</option>
                <option value="dictator">Dictator</option>
            </select> <br>
            <label for="imageInput">Submit an image file:</label> <br>
            <input type="file" id="imageInput"> <br>
            <img src="" height="200" id="imageInputPreview"><br>
            <input type="button" Onclick="SubmitCharacter()" id="submitCharacter" value="Submit"> <br>
        </div>
    </div>

    <div id="characters-list"></div>
</body>
</html>
